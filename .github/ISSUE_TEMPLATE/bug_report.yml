name: Bug report
description: Something in Floret is broken, wrong or confusing.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. The more of this you fill in, the
        faster it can be fixed. Please do not report security problems here:
        email Floret.make@gmail.com instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: "I expected the circle to grow, but it stayed the same size."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order, as exactly as you can.
      placeholder: |
        1. Open the sample ...
        2. Drag the ... value
        3. ...
    validations:
      required: true
  - type: input
    id: sample
    attributes:
      label: Sample or patch name
      description: The sample's name in the Library, or attach your .flora file below.
      placeholder: "Slime Mould, or my-patch.flora"
  - type: input
    id: version
    attributes:
      label: Floret version
      description: Shown in the About window and in the bottom bar of the window.
      placeholder: "v0.2.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and GPU
      description: For example "macOS 14.5, MacBook Air M2" or "Windows 11, NVIDIA RTX 3060".
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot, patch file or error details
      description: |
        Drag a screenshot, screen recording or .flora file (zip it first if
        GitHub refuses it) into this box. If Floret showed a "Something went
        wrong" window, press Copy details and paste it here.
