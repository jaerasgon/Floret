name: native

# Manual only (Actions tab → native → Run workflow), to stay inside the
# free Actions minutes. macOS minutes count 10× and Windows 2× on private
# repos, so those only run when picked. Day to day, test locally with
# ./floret.sh and `cargo test --workspace`.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Where to run'
        type: choice
        default: linux
        options: [linux, linux+macos, all]
      app_builds:
        description: 'Also build downloadable apps'
        type: boolean
        default: false

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || inputs.platforms == 'linux+macos' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # ALSA for cpal (audio) and midir (MIDI); nokhwa's V4L2 bindings only
      # need the kernel headers and libclang, both preinstalled.
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (includes parity against the TypeScript reference)
        run: cargo test --workspace -- --nocapture

  app:
    name: app build (${{ matrix.os }})
    if: inputs.app_builds
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || inputs.platforms == 'linux+macos' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # ALSA for cpal (audio) and midir (MIDI); nokhwa's V4L2 bindings only
      # need the kernel headers and libclang, both preinstalled.
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build release
        run: cargo build --release -p floret-app
      - uses: actions/upload-artifact@v7
        with:
          # (No matrix `include` here: an include for an OS not picked would
          # add that OS back as a job.)
          name: ${{ matrix.os == 'macos-latest' && 'floret-macos-arm64' || matrix.os == 'windows-latest' && 'floret-windows-x64' || 'floret-linux-x64' }}
          path: native/target/release/${{ matrix.os == 'windows-latest' && 'floret.exe' || 'floret' }}
          retention-days: 30
