name: native

on:
  push:
    branches: [main]
    paths: ['native/**', 'public/mediapipe/models/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'public/mediapipe/models/**', '.github/workflows/native.yml']

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # ALSA for cpal (audio) and midir (MIDI); nokhwa's V4L2 bindings only
      # need the kernel headers and libclang, both preinstalled.
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (includes parity against the TypeScript reference)
        run: cargo test --workspace -- --nocapture

  app:
    name: app build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: floret-macos-arm64
            bin: target/release/floret
          - os: windows-latest
            artifact: floret-windows-x64
            bin: target/release/floret.exe
          - os: ubuntu-latest
            artifact: floret-linux-x64
            bin: target/release/floret
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # ALSA for cpal (audio) and midir (MIDI); nokhwa's V4L2 bindings only
      # need the kernel headers and libclang, both preinstalled.
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build release
        run: cargo build --release -p floret-app
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: native/${{ matrix.bin }}
          retention-days: 30
