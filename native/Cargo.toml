[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = "2"
flate2 = "1"

[profile.dev.package."*"]
opt-level = 2
# Dependencies' debug info is most of the build size; our crates keep theirs.
debug = false

# The audio thread's DSP has to keep up in debug builds too.
[profile.dev.package.floret-media]
opt-level = 3

# Landmark tracking runs neural nets; unoptimised it's far too slow to use.
[profile.dev.package.floret-input]
opt-level = 3

# Per-pixel frame conversion keeps up with playback in debug builds too.
[profile.dev.package.floret-video]
opt-level = 3

# The engine's node maths (simulations, noise, spreads) and the renderer's
# per-frame batching are far too slow unoptimised; level 1 speeds them up a
# lot while keeping debug builds quick to compile and debuggable.
[profile.dev.package.floret-engine]
opt-level = 1

[profile.dev.package.floret-render]
opt-level = 1

# `./floret.sh` builds with this: optimised like release, but incremental so
# a rebuild after a pull only recompiles what changed.
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256
