[package]
name = "floret-app"
description = "Floret desktop app (egui + wgpu)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "floret"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true

[dependencies]
floret-engine = { path = "../floret-engine" }
floret-render = { path = "../floret-render" }
floret-media = { path = "../floret-media" }
floret-input = { path = "../floret-input" }
# Finder double-click / Open With (macOS open-documents events).
floret-open-files = { path = "../floret-open-files" }
# H.264 on macOS through Apple's licensed codecs only; OpenH264 elsewhere
# (see floret-video's src/export.rs).
floret-video = { path = "../floret-video", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
serde_json.workspace = true
indexmap.workspace = true
rfd = "0.17"
png = "0.18"
pollster = "1"
# io/image-url over http(s) (the engine's host fetcher, see src/host.rs), checking
# certificates with the OS (so proxies with their own CA work, as in a browser).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# Dockable side panels (workspace.rs) and their saved layout.
egui_dock = { version = "0.21", features = ["serde"] }
# Interface icons (the Phosphor icon font; see THIRD_PARTY_NOTICES.md).
egui-phosphor = "0.14"
serde.workspace = true
# Paste from the Edit menu (already in the tree through egui-winit).
arboard = { version = "3", default-features = false }

[dev-dependencies]
# Reading exported GIFs back in tests.
gif = "0.14"

# Native menu bar (macOS, Windows). Linux uses an egui menu bar: muda needs
# a GTK window there and winit doesn't create one.
[target.'cfg(not(target_os = "macos"))'.dependencies]
floret-video = { path = "../floret-video", features = ["openh264"] }

# The local time zone for the Clock node (`localtime_r`; already in the
# tree through other crates).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
