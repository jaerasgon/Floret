[package]
name = "floret-app"
description = "Floret desktop app (egui + wgpu)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.95"

[[bin]]
name = "floret"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true

[dependencies]
floret-engine = { path = "../floret-engine" }
floret-render = { path = "../floret-render" }
floret-media = { path = "../floret-media" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
serde_json.workspace = true
indexmap.workspace = true
rfd = "0.17"
png = "0.18"
pollster = "1"
# io/image-url over http(s) (the engine's host fetcher, see src/host.rs).
ureq = { version = "3", default-features = false, features = ["rustls"] }
