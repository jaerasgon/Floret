[package]
name = "floret-app"
description = "Floret desktop app (egui + wgpu)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.95"

[[bin]]
name = "floret"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true

[dependencies]
floret-engine = { path = "../floret-engine" }
floret-render = { path = "../floret-render" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
serde_json.workspace = true
indexmap.workspace = true
