[package]
name = "floret-engine"
description = "Floret dataflow engine: patch loading, compile, tick, node computes. No GPU/UI/OS deps."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
# Image file decoding and SVG rasterisation (pure CPU, see `image.rs`); SVG
# text uses the system fonts, embedded raster images are decoded by resvg.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# Typography (`text.rs`): the font database, shaper and outline reader
# cosmic-text uses in the renderer, so both sides share one set of faces.
fontdb = "0.23"
harfrust = "0.5"
skrifa = "0.40"
unicode-bidi = "0.3"
# WOFF / WOFF2 font files.
wuff = "0.2"
# Geometry nodes (`nodes/geometry`): Delaunay triangulation, and polygon
# boolean / offset ops. Pure Rust, permissive (ISC, MIT / Apache-2.0); both
# need Rust 1.88.
delaunator = "1.1"
i_overlay = { version = "9", default-features = false }

[dev-dependencies]
flate2.workspace = true
