[package]
name = "floret-render"
description = "Floret GPU scene renderer (wgpu): turns the engine's SceneNode tree into pixels."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
floret-engine = { path = "../floret-engine" }
# Same major as egui-wgpu 0.36 so the app can share its device / queue.
wgpu = { version = "30", features = ["naga-ir"] }
# The naga wgpu 30 uses; its GLSL frontend compiles `gpu/shader` sources.
naga = { version = "30.0.1", features = ["glsl-in"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
serde_json.workspace = true
swash = "0.2"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }

[dev-dependencies]
flate2.workspace = true
png = "0.18"
