[package]
name = "floret-video"
description = "Floret video playback and MP4 export: MP4 demux (re_mp4), H.264 via OpenH264, and AVFoundation on macOS."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["openh264"]
# H.264 decoding and encoding (video export, test clips) from OpenH264's
# bundled source. The app's macOS build turns it off and uses Apple's
# licensed codecs instead (see src/export.rs).
openh264 = ["dep:openh264"]

[dependencies]
floret-engine = { path = "../floret-engine" }
re_mp4 = "0.5"
# Animated GIF export (MIT / Apache-2.0; already in the tree through image).
gif = "0.14"
openh264 = { version = "0.9", optional = true }

[dev-dependencies]
# Writing PNG / JPEG frames for the image-sequence tests (already in the
# tree through floret-engine).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[example]]
name = "sample_clip"
required-features = ["openh264"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue", "objc2-core-foundation"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-foundation", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange", "objc2-core-audio-types", "objc2-core-video"] }
# The sound track of an export: Apple's AAC encoder, fed float PCM.
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSettings"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
